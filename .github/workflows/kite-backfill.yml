name: Kite Backfill (one-time historical)

# Run manually from the Actions tab. Paste the request_token, pick the universe.
on:
  workflow_dispatch:
    inputs:
      request_token:
        description: "Paste the request_token from the login redirect URL"
        required: true
        type: string
      universe:
        description: "store = ~2.6k in-store symbols (~30 min) | all = ~18k NSE EQ (~3h)"
        required: true
        type: choice
        default: store
        options:
          - store
          - all

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install kiteconnect pandas pyarrow numpy requests

      - name: Run Kite backfill (2019 -> present gap)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_REQUEST_TOKEN: ${{ inputs.request_token }}
          BACKFILL_START: "2019-01-01"
          BACKFILL_UNIVERSE: ${{ inputs.universe }}
        run: python scripts/kite_backfill.py

      # ---- BANK THE EXPENSIVE PULL FIRST, before anything else can fail ----
      - name: Commit price store (bank the pull)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data/prices.parquet
          git commit -m "Kite backfill: 2019+ daily OHLC (price store)" || echo "no price changes"
          git push

      # Second safety net: a downloadable copy even if the push had trouble.
      - name: Upload price store as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prices-parquet
          path: data/prices.parquet
          retention-days: 7
      # ---------------------------------------------------------------------

      - name: Rebuild breadth history from the enlarged store
        run: python scripts/ingest.py --recompute

      - name: Commit breadth history
        run: |
          git add -A data/breadth_history.csv data/lists data/validation.txt
          git commit -m "Recompute breadth over 2019+ store" || echo "no breadth changes"
          git push

      - name: Export portable CSV copy
        run: python scripts/export_csv.py

      - name: Commit the portable CSV copy
        run: |
          git add -A data/csv
          git commit -m "Portable CSV export of price store" || echo "no changes"
          git push
