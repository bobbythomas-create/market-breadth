name: breadth-daily

on:
  schedule:
    - cron: "45 13 * * 1-5"     # 13:45 UTC = 19:15 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill start date YYYY-MM-DD (leave blank for incremental)"
        required: false
        default: ""
      refetch_from:
        description: "REFETCH start YYYY-MM-DD (re-download to add OHLC; do in <=4-month chunks)"
        required: false
        default: ""
      refetch_to:
        description: "REFETCH end YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ingest
        run: |
          if [ -n "${{ github.event.inputs.refetch_from }}" ]; then
            python scripts/ingest.py --refetch --backfill "${{ github.event.inputs.refetch_from }}" --end "${{ github.event.inputs.refetch_to }}" --max-days 200
          elif [ -n "${{ github.event.inputs.backfill }}" ]; then
            python scripts/ingest.py --backfill "${{ github.event.inputs.backfill }}" --max-days 120
          else
            python scripts/ingest.py
          fi

      - name: Frameworks
        run: python scripts/frameworks.py --src frameworks || echo "frameworks skipped"

      - name: Screen
        run: python scripts/screen.py --min-rs 70 || echo "screen step failed, continuing"

      - name: Trader
        run: python scripts/trader.py || echo "trader step skipped"

      - name: Changes
        run: python scripts/changes.py || echo "changes skipped"

      - name: Render
        run: python scripts/render.py --csv data/breadth_history.csv --out dashboard.html --rows 250

      - name: Fail loudly on validation findings
        run: |
          cat data/validation.txt
          grep -q "no issues found" data/validation.txt || echo "::warning::validation findings, see log"

      - name: Commit
        run: |
          git config user.name  "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add data/breadth_history.csv data/validation.txt data/lists data/stocks.json data/frameworks.json data/trader.json data/changes.json data/state_snapshot.json data/constituents.json dashboard.html
          git add -f data/*.parquet || true
          git diff --staged --quiet || git commit -m "breadth $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
